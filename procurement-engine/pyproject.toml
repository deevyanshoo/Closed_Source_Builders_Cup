[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "procure"
version = "0.1.0"
description = "AI Procurement Engine prototype"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: real provider calls; opt in with RUN_LIVE_GEMINI=1"]
